name: Workspace Image

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: workspace-image-release
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      repository: ${{ steps.release.outputs.repository }}
      image: ${{ steps.release.outputs.image }}
      build: ${{ steps.candidate.outputs.build }}
    steps:
      - name: Find latest stable Codex release
        id: release
        shell: bash
        run: |
          release=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            https://api.github.com/repos/openai/codex/releases/latest)
          version=$(jq -er '
            select(.draft == false and .prerelease == false)
            | .tag_name | capture("^rust-v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)$").version
          ' <<< "$release")
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$owner/cloudex-workspace"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "image=$repository:codex-$version" >> "$GITHUB_OUTPUT"

      # A tag counts as published only as an index holding both platforms, so a
      # single-platform tag from an earlier release is rebuilt.
      - name: Check publication and npm availability
        id: candidate
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          image_path=${IMAGE#ghcr.io/}
          token_response=$(curl --fail --silent --show-error --retry 3 --max-time 30 \
            --user "$GITHUB_ACTOR:$GHCR_PASSWORD" --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${image_path%:*}:pull" https://ghcr.io/token)
          token=$(jq -er '.token | select(type == "string" and length > 0)' <<< "$token_response")
          manifest=$(mktemp)
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            --output "$manifest" --write-out '%{http_code}' \
            "https://ghcr.io/v2/${image_path%:*}/manifests/${image_path##*:}")
          case "$status" in
            200)
              platforms=$(jq -r '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")' "$manifest")
              if [[ "$platforms" == "linux/amd64 linux/arm64" ]]; then
                echo "$IMAGE is already published for linux/amd64 and linux/arm64"
                exit 0
              fi
              echo "$IMAGE is published for '${platforms:-a single platform}'; rebuilding both platforms"
              ;;
            404) ;;
            *) echo "GHCR manifest check returned HTTP $status for $IMAGE" >&2; exit 1 ;;
          esac

          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@openai%2fcodex/$CODEX_VERSION")
          case "$status" in
            200) echo 'build=true' >> "$GITHUB_OUTPUT" ;;
            404) echo "Codex $CODEX_VERSION is not available on npm yet" ;;
            *) echo "npm version check returned HTTP $status for Codex $CODEX_VERSION" >&2; exit 1 ;;
          esac

  # Each platform builds and passes acceptance on a native runner. The release
  # tag is created only after both platforms pass.
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      REPOSITORY: ${{ needs.check.outputs.repository }}
      IMAGE: ${{ needs.check.outputs.image }}
      CODEX_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image into the local Docker daemon
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.workspace
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: CODEX_VERSION=${{ env.CODEX_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Validate candidate version and run gateway acceptance
        working-directory: apps/api
        env:
          CLOUDEX_TEST_DOCKER: '1'
          CLOUDEX_TEST_WORKSPACE_IMAGE: ${{ env.IMAGE }}
          CLOUDEX_TEST_CODEX_VERSION: ${{ env.CODEX_VERSION }}
        shell: bash
        run: |
          installed=$(docker run --rm --user coder --entrypoint codex "$CLOUDEX_TEST_WORKSPACE_IMAGE" --version)
          if [[ "$installed" != "codex-cli $CLOUDEX_TEST_CODEX_VERSION" ]]; then
            echo "Expected codex-cli $CLOUDEX_TEST_CODEX_VERSION, got $installed" >&2
            exit 1
          fi
          CLOUDEX_TEST_GATEWAY_DNS=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export CLOUDEX_TEST_GATEWAY_DNS
          go test -count=1 -v ./cmd/server -run '^TestPinnedCodexGatewayMatrix$/docker$'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same inputs resolve from the builder cache, so the pushed layers are
      # the ones that passed acceptance.
      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.workspace
          platforms: ${{ matrix.platform }}
          build-args: CODEX_VERSION=${{ env.CODEX_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: workspace-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ${{ needs.check.outputs.repository }}
      IMAGE: ${{ needs.check.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: workspace-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested images under the release tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "$IMAGE" $(printf "$REPOSITORY@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE"
