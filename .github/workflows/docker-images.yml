name: Cloudex Images

# Release tags publish versioned images after the repository checks pass.
# Manual runs publish manual-<full sha> tags only and never move latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REVISION_TAG: ${{ github.event_name == 'push' && format('sha-{0}', github.sha) || format('manual-{0}', github.sha) }}

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web and run checks
        run: make build check

  # Each platform builds on a native runner and pushes by digest. The Next.js
  # build crashes under QEMU, and its standalone output bundles
  # platform-specific sharp binaries, so the web image cannot be cross-built.
  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [cloudex-api, cloudex-agent, cloudex-web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: cloudex-api
            file: docker/Dockerfile.api
            target: api
          - image: cloudex-agent
            file: docker/Dockerfile.api
            target: agent
          - image: cloudex-web
            file: docker/Dockerfile.web
            target: ''
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: &release_flavor latest=false
          tags: &release_tags |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ env.REVISION_TAG }},priority=100
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.image }} for ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.image == 'cloudex-api' && format('CLOUDEX_WORKSPACE_IMAGE={0}/{1}/cloudex-workspace:{2}', env.REGISTRY, github.repository_owner, env.REVISION_TAG) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  workspace:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CANDIDATE_IMAGE: cloudex/workspace:candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudex-workspace
          flavor: *release_flavor
          tags: *release_tags

      # Export both copies from one build so the published image is the one tested.
      - name: Build and load candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.workspace
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/workspace-oci,tar=false
          provenance: false
          sbom: false

      - name: Validate candidate version and run gateway acceptance
        working-directory: apps/api
        env:
          CLOUDEX_TEST_DOCKER: '1'
          CLOUDEX_TEST_WORKSPACE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        shell: bash
        run: |
          # The image must ship the Codex version the control plane pins.
          CLOUDEX_TEST_CODEX_VERSION=$(sed -nE 's/^[[:space:]]*CodexClientVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/codexupstream/client.go)
          if [[ -z "$CLOUDEX_TEST_CODEX_VERSION" ]]; then
            echo "CodexClientVersion was not found in internal/codexupstream/client.go" >&2
            exit 1
          fi
          export CLOUDEX_TEST_CODEX_VERSION
          installed=$(docker run --rm --user coder --entrypoint codex "$CLOUDEX_TEST_WORKSPACE_IMAGE" --version)
          if [[ "$installed" != "codex-cli $CLOUDEX_TEST_CODEX_VERSION" ]]; then
            echo "Expected codex-cli $CLOUDEX_TEST_CODEX_VERSION from CodexClientVersion, got $installed. Update CODEX_VERSION in docker/Dockerfile.workspace and CodexClientVersion together." >&2
            exit 1
          fi
          CLOUDEX_TEST_GATEWAY_DNS=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export CLOUDEX_TEST_GATEWAY_DNS
          go test -count=1 -v ./cmd/server -run '^TestPinnedCodexGatewayMatrix$/docker$'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image by digest
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cloudex-workspace
        run: |
          # The arm64 runner image does not list skopeo.
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          layout="$RUNNER_TEMP/workspace-oci"
          digest=$(jq -er '.manifests[0].digest' "$layout/index.json")
          skopeo copy --preserve-digests "oci:$layout" "docker://$REPOSITORY@$digest"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-cloudex-workspace-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build, workspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudex-image-publication
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: *release_flavor
          tags: *release_tags

      # Make the workspace tag available before publishing any API that references it.
      - name: Push multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          NAMESPACE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          shopt -s nullglob
          for name in cloudex-workspace cloudex-api cloudex-agent cloudex-web; do
            image="$NAMESPACE/$name"
            sources=()
            for arch in amd64 arm64; do
              digests=(digests-"$name"-"$arch"/*)
              if [[ ${#digests[@]} -ne 1 ]]; then
                echo "Expected one digest for $name on linux/$arch" >&2
                exit 1
              fi
              sources+=("$image@sha256:${digests[0]##*/}")
            done
            tags=()
            while IFS= read -r tag; do
              tags+=(-t "$image:$tag")
            done <<< "$TAG_NAMES"
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$VERSION"
          done
